# Fly.io: the Bookdelver server from its published image, HTTPS on
# <your-app>.fly.dev. A template: this repository creates nothing on Fly.
#
#   fly launch --copy-config --no-deploy   # pick your app's name
#   fly volumes create bookdelver_data --size 1
#   fly deploy
#
# Then set BOOKDELVER_URL below to wss://<your-app>.fly.dev and deploy again,
# and read the owner invite with `fly logs`.
app = "your-bookdelver-server"
primary_region = "iad"

[build]
  image = "ghcr.io/cwpetrich/bookdelver-server:latest"

[env]
  BOOKDELVER_URL = "wss://your-bookdelver-server.fly.dev"
  BOOKDELVER_DATA = "/data"
  BOOKDELVER_PORT = "8787"

[[mounts]]
  source = "bookdelver_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # One machine, always on: a table's players stay connected to it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
